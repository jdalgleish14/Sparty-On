name: Playoff predictor preview checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/playoffs/requirements.txt
      - run: python -m unittest discover -s tools/playoffs -v
      - run: python tools/playoffs/predict.py --fetch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/playoffs/*.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: playoff-preview-data
          path: |
            site-data/playoff-predictor.js
            site-data/playoffs/raw/
# No commit, push, Cloudflare action, or Pages deployment.
