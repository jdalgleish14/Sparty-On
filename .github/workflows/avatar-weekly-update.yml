name: Sleeper avatar weekly update

# Keeps owner photos in assets/avatars/ in step with Sleeper. Independent of the
# Sleeper data sync: it only ever commits files under assets/avatars/.
on:
  workflow_dispatch:
  schedule:
    # Sunday morning, Eastern local time.
    - cron: "0 9 * * 0"
      timezone: "America/New_York"

permissions:
  contents: write
  pages: write

concurrency:
  group: sleeper-avatar-update
  cancel-in-progress: false

jobs:
  avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch owner avatars from Sleeper
        run: python tools/avatars/fetch_avatars.py
      - name: Commit and push changed avatars
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/avatars
          if git diff --cached --quiet; then
            echo "No avatar changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sleeper avatars: refresh owner photos"
          git push origin HEAD:refs/heads/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request the live Pages build
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.published_sha }}
        run: |
          # Bot commits do not automatically trigger branch-source Pages builds.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null
          echo "Published $PUBLISHED_SHA and requested a GitHub Pages build." >> "$GITHUB_STEP_SUMMARY"
