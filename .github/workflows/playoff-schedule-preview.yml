name: Playoff schedule preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public league configuration and remaining schedule
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, urllib.request
          root=pathlib.Path('playoff-schedule-preview'); root.mkdir()
          source=pathlib.Path('site-data')
          mapping=json.loads((source/'sleeper/owner_map.json').read_text())
          manifest=json.loads((source/'manifest.json').read_text())
          cutoff=manifest['publication_cutoff']['current_season_through_week']
          if not 0<=cutoff<=14: raise ValueError('Regular-season cutoff required')
          league_id=mapping['league_id']
          if not str(league_id).isdigit(): raise ValueError('Invalid league ID')
          def fetch(path,name):
              url='https://api.sleeper.app/v1/league/'+str(league_id)+path
              req=urllib.request.Request(url,headers={'User-Agent':'Sparty-On-playoff-preview/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r: data=json.load(r)
              (root/name).write_text(json.dumps(data,indent=2)+'\n')
          fetch('','league.json')
          for week in range(cutoff+1,15): fetch('/matchups/'+str(week),f'week-{week:02}.json')
          for name in ['manifest.json','current_standings.json','games.json','owner_careers.json']:
              (root/name).write_bytes((source/name).read_bytes())
          (root/'owner_map.json').write_bytes((source/'sleeper/owner_map.json').read_bytes())
          print('Collected read-only preview inputs; no website changes made.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: playoff-schedule-preview
          path: playoff-schedule-preview/
          retention-days: 14
          if-no-files-found: error
# Read-only job: no git writes, Pages build, Cloudflare calls, or secrets.
